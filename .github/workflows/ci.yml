name: CI

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop --format github

  test:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - name: Run specs
      run: bundle exec rspec

  # ---------------------------------------------------------------------------
  # Release pipeline (v* tags only): push the gem to RubyGems, then redeploy the
  # documentation site from the same tagged tree. Both halves of a version ship
  # from this one run -- nothing about a release is manual except cutting the tag.
  # ---------------------------------------------------------------------------

  publish:
    name: Build + Publish
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - uses: rubygems/release-gem@v1

  docs:
    name: Deploy docs
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
