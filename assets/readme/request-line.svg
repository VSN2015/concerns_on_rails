<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">One request through four controller concerns</title>
  <desc id="desc">GET /articles?published=1&amp;sort=-title&amp;page=2 travels along a rail through Filterable, Sortable, Paginatable and Respondable, which together are one line of controller code: render_success(data: paginated(sorted(filtered(Article.all)))).</desc>

  <defs>
    <pattern id="sleepers" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="9" width="4" height="28" rx="2" fill="#4a423a"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#211e1a"/>

  <text id="request" x="56" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a39c8f">GET /articles?<tspan fill="#e8c07d">published=1</tspan>&amp;<tspan fill="#e8c07d">sort=-title</tspan>&amp;<tspan fill="#e8c07d">page=2</tspan></text>

  <g id="rail">
    <rect x="56" y="180" width="1088" height="28" fill="url(#sleepers)"/>
    <path d="M56 186H1144M56 202H1144" stroke="#c13c3b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="stations" text-anchor="middle">
    <g fill="#211e1a" stroke="#ff8e89" stroke-width="4">
      <circle cx="192" cy="194" r="17"/>
      <circle cx="464" cy="194" r="17"/>
      <circle cx="736" cy="194" r="17"/>
      <circle cx="1008" cy="194" r="17"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#faf7f2">
      <text x="192" y="150">Filterable</text>
      <text x="464" y="150">Sortable</text>
      <text x="736" y="150">Paginatable</text>
      <text x="1008" y="150">Respondable</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e8c07d">
      <text x="192" y="250">?published=1</text>
      <text x="464" y="250">?sort=-title</text>
      <text x="736" y="250">?page=2</text>
      <text x="1008" y="250" fill="#a39c8f">JSON envelope</text>
    </g>
  </g>

  <text id="code" x="56" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e9e4d9"><tspan fill="#ff8e89">render_success</tspan>(data: <tspan fill="#ff8e89">paginated</tspan>(<tspan fill="#ff8e89">sorted</tspan>(<tspan fill="#ff8e89">filtered</tspan>(Article.all))))</text>
</svg>
