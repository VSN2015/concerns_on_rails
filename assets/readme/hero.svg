<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ConcernsOnRails</title>
  <desc id="desc">ActiveSupport concerns for Rails models and controllers. One include, one macro, done. An Article model includes Sluggable, Publishable and SoftDeletable, then calls sluggable_by :title.</desc>

  <defs>
    <pattern id="sleepers" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="9" width="4" height="28" rx="2" fill="#4a423a"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#211e1a"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#a39c8f">RUBY GEM · RAILS 6.0 – 8.1</text>
    <text x="56" y="166" font-size="60" font-weight="800" fill="#faf7f2">Concerns<tspan fill="#ff8e89">OnRails</tspan></text>
    <text x="56" y="218" font-size="28" fill="#e9e4d9">One include. One macro. Done.</text>
    <text x="56" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a39c8f">26 model + 17 controller concerns</text>
  </g>

  <g id="project-proof" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e9e4d9">
    <rect x="604" y="48" width="540" height="256" rx="14" fill="#2c2823"/>
    <text x="632" y="92"><tspan fill="#ff8e89">class</tspan> Article &lt; ApplicationRecord</text>
    <text x="632" y="122" xml:space="preserve">  <tspan fill="#ff8e89">include</tspan> ConcernsOnRails::Sluggable</text>
    <text x="632" y="152" xml:space="preserve">  <tspan fill="#ff8e89">include</tspan> ConcernsOnRails::Publishable</text>
    <text x="632" y="182" xml:space="preserve">  <tspan fill="#ff8e89">include</tspan> ConcernsOnRails::SoftDeletable</text>
    <text x="632" y="242" xml:space="preserve">  sluggable_by <tspan fill="#e8c07d">:title</tspan></text>
    <text x="632" y="272" fill="#ff8e89">end</text>
  </g>

  <g id="rail">
    <rect x="56" y="326" width="1088" height="28" fill="url(#sleepers)"/>
    <path d="M56 332H1144M56 348H1144" stroke="#c13c3b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="56" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e9e4d9"><tspan fill="#ff8e89">&gt; </tspan>Article.published.without_deleted.find(<tspan fill="#e8c07d">"hello-world"</tspan>)</text>
</svg>
